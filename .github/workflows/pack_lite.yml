name: Pack Lite IPK and APK

on:
  push:
    branches:
      - master
    paths:
      - 'luci-app-openclash/**'
      - 'tools/pack-openclash.sh'
      - '.github/workflows/pack_lite.yml'
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install packer dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install meson ninja-build libssl-dev zlib1g-dev pkg-config

      - name: Build apk-tools 3.0.5
        run: |
          git clone --depth 1 https://github.com/alpinelinux/apk-tools.git /tmp/apk-tools
          git -C /tmp/apk-tools fetch --depth 1 origin b5a31c0d865342ad80be10d68f1bb3d3ad9b0866
          git -C /tmp/apk-tools checkout b5a31c0d865342ad80be10d68f1bb3d3ad9b0866
          meson setup /tmp/apk-tools/build /tmp/apk-tools \
            -Ddocs=disabled -Dhelp=disabled -Dlua=disabled -Dpython=disabled \
            -Dtests=disabled -Dzstd=disabled -Dcrypto_backend=openssl \
            -Ddefault_library=static
          ninja -C /tmp/apk-tools/build

      - name: Pack IPK and APK
        env:
          APK_BIN: /tmp/apk-tools/build/src/apk
        run: ./tools/pack-openclash.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: openclash-lite-packages
          path: |
            bin/luci-app-openclash-*.apk
            bin/luci-app-openclash_*.ipk
